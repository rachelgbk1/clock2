<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selenicereus — a clock</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { position: absolute; inset: 0; }
    #phase-line {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      white-space: nowrap;
    }

    #species {
      position: absolute;
      z-index: 10;
      bottom: 32px;
      left: 36px;
      pointer-events: none;
    }
    #species .name {
      display: block;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 11px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.06em;
    }
    #species .sub {
      display: block;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.08);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="phase-line"></div>

  <div id="species">
    <span class="name">Selenicereus grandiflorus</span>
    <span class="sub">Queen of the Night</span>
  </div>

  <script>
  (function () {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const phaseEl = document.getElementById('phase-line');
    const STORAGE_KEY = 'selenicereus_v3';

    // --- PERSISTENT STATE ---
    function loadState() {
      try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
      return { bloomCount: 0, petals: [], lastDate: null };
    }
    function saveState() {
      try {
        const s = { ...state, petals: state.petals.slice(-300) };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      } catch(e) {}
    }

    let state = loadState();
    let W, H, CX, GY;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      CX = W / 2;
      GY = H - Math.round(H * 0.07);
    }
    resize();
    window.addEventListener('resize', resize);
    seedMissedPetals();

    function lerp(a, b, t) { return a + (b - a) * t; }
    function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // LIFE PROGRESS — 0 at midnight, grows to 1 at noon, falls back to 0 at midnight
    function lifeProgress(secs) {
      // 0:00 = 0, 12:00 = 1, 23:59 = ~0
      if (secs <= 43200) {
        return secs / 43200;          // midnight → noon: growing 0→1
      } else {
        return 1 - (secs - 43200) / 43200; // noon → midnight: dying 1→0
      }
    }

    // --- PHASES (keyed to corrected direction) ---
    const PHASES = [
      [0,    0.05,  'dormant'],
      [0.05, 0.18,  'the first tendril emerges'],
      [0.18, 0.38,  'reaching for light'],
      [0.38, 0.55,  'a bud forms'],
      [0.55, 0.75,  'opening'],
      [0.75, 0.92,  'full bloom'],
      // death phases — triggered when dying (pm side)
    ];
    const DEATH_PHASES = [
      [0.92, 1.01, 'full bloom'],
      [0.72, 0.92, 'the petals begin to fall'],
      [0.45, 0.72, 'withdrawing'],
      [0.18, 0.45, 'returning to the ground'],
      [0,    0.18, 'dormant'],
    ];
    function getPhase(p, isAM) {
      const list = isAM ? PHASES : DEATH_PHASES;
      for (const [lo, hi, text] of list) {
        if (p >= lo && p < hi) return text;
      }
      return '';
    }

    // --- FALLEN PETALS ---
    let saveTimer = null;
    function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 2000); }

    let lastPetalTime = 0;

    function findFreeSpot(cx) {
      // Try up to 12 random positions, pick one that doesn't overlap settled petals
      const minDist = 28;
      for (let attempt = 0; attempt < 12; attempt++) {
        const tx = cx + (Math.random() - 0.5) * W * 0.55;
        const ty = GY - 2 - Math.random() * 6;
        const tooClose = state.petals.some(fp =>
          fp.settled && Math.abs(fp.tx - tx) < minDist
        );
        if (!tooClose) return { tx, ty };
      }
      // Fallback: just place it anyway
      return {
        tx: cx + (Math.random() - 0.5) * W * 0.55,
        ty: GY - 2 - Math.random() * 6
      };
    }

    function spawnPetal(cx, cy, p, instant) {
      const intensity = clamp((1 - p) / 0.55, 0, 1);
      const { tx, ty } = findFreeSpot(cx || W / 2);
      state.petals.push({
        x: instant ? tx : (cx + (Math.random() - 0.5) * 50),
        y: instant ? ty : cy,
        tx, ty,
        rot: Math.random() * Math.PI * 2,
        size: 7 + Math.random() * 8,
        alpha: 0.45 + intensity * 0.2,
        settled: instant ? true : false,
        day: state.bloomCount
      });
      if (!instant) scheduleSave();
    }

    function seedMissedPetals() {
      // Work out how many petals should have fallen before page load
      const now = new Date();
      const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      if (secs <= 43200) return; // AM — none yet today
      const minutesSinceNoon = Math.floor((secs - 43200) / 60);
      const already = state.petals.length;
      const needed = Math.max(0, minutesSinceNoon - already);
      // Add them silently as already-settled petals
      for (let i = 0; i < needed; i++) {
        spawnPetal(W / 2, GY, 1 - (i / 720), true);
      }
      if (needed > 0) saveState();
    }

    function drawFallenPetals(now) {
      const t = now * 0.001;
      state.petals.forEach(fp => {
        if (!fp.settled) {
          fp.x = lerp(fp.x, fp.tx, 0.014);
          fp.y = lerp(fp.y, fp.ty, 0.011);
          fp.rot += 0.022;
          if (Math.abs(fp.x - fp.tx) < 1.2 && Math.abs(fp.y - fp.ty) < 1.2) fp.settled = true;
        }
        const sway = fp.settled ? Math.sin(t * 0.35 + fp.rot) * 1.5 : 0;
        ctx.save();
        ctx.translate(fp.x + sway, fp.y);
        ctx.rotate(fp.rot);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-fp.size * 0.25, -fp.size * 0.3, -fp.size * 0.35, -fp.size * 0.7, 0, -fp.size);
        ctx.bezierCurveTo( fp.size * 0.35, -fp.size * 0.7,  fp.size * 0.25, -fp.size * 0.3, 0, 0);
        ctx.fillStyle = `rgba(235,235,228,${fp.alpha})`;
        ctx.fill();
        ctx.restore();
      });
    }

    // --- GROUND LINE ---
    function drawGround(p) {
      // Thin ground line, nearly invisible — just enough to root the stem
      ctx.fillStyle = `rgba(20,20,20,1)`;
      ctx.fillRect(0, GY, W, H - GY);
      // Subtle ground edge
      ctx.beginPath();
      ctx.moveTo(0, GY);
      ctx.lineTo(W, GY);
      ctx.strokeStyle = `rgba(255,255,255,0.04)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // --- STEM ---
    function drawStem(p, now) {
      if (p < 0.02) return null;
      const stemH = ease(clamp(p * 1.2, 0, 1)) * Math.min(H * 0.50, 260);
      const sway = Math.sin(now * 0.0008) * 7 * Math.min(p, 1);
      const topX = CX + sway;
      const topY = GY - stemH;

      // Deep green, almost black at base
      const g = ctx.createLinearGradient(CX, GY, topX, topY);
      g.addColorStop(0, `rgba(8,28,10,${Math.min(p * 2, 1)})`);
      g.addColorStop(0.5, `rgba(18,55,22,${Math.min(p * 2, 1)})`);
      g.addColorStop(1, `rgba(30,80,35,${Math.min(p * 2, 1)})`);

      ctx.beginPath();
      ctx.moveTo(CX, GY);
      ctx.quadraticCurveTo(CX + sway * 0.4, (GY + topY) / 2, topX, topY);
      ctx.lineWidth = Math.max(2, 5 * Math.min(p * 1.3, 1));
      ctx.strokeStyle = g;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Two leaves — sparse, structural
      if (p > 0.2) drawLeaf(CX + sway * 0.3, GY - stemH * 0.35, -1, Math.min((p-0.2)/0.3,1), now);
      if (p > 0.32) drawLeaf(CX + sway * 0.62, GY - stemH * 0.6, 1, Math.min((p-0.32)/0.3,1), now);

      return { x: topX, y: topY };
    }

    function drawLeaf(lx, ly, dir, lp, now) {
      const lw = 38 * lp, lh = 16 * lp;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(dir * (Math.PI / 5.2 + Math.sin(now * 0.0007) * 0.04));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(dir*lw*0.4, -lh*0.8, dir*lw*0.9, -lh*0.45, dir*lw, -lh*0.2);
      ctx.bezierCurveTo(dir*lw*0.85, lh*0.15, dir*lw*0.4, lh*0.3, 0, 0);
      // Dark olive green
      ctx.fillStyle = `rgba(22,52,24,${lp * 0.9})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(35,70,38,${lp * 0.5})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
      ctx.restore();
    }

    // --- FLOWER ---
    function drawFlower(cx, cy, p, isAM, secs, now) {
      if (p < 0.06) return;
      const fp = Math.max(0, (p - 0.06) / 0.94);
      const spin = secs * 0.004;
      const maxR = Math.min(H * 0.17, 92);
      const globalAlpha = isAM ? fp : fp * p;

      // LAYER 1: outer spiky sepals — long, thin, amber-gold
      const outerN = 18;
      const outerL = ease(fp) * maxR * 1.35;
      for (let i = 0; i < outerN; i++) {
        const angle = (i / outerN) * Math.PI * 2 + spin * 0.6;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        const tip = -outerL;
        const cpx = ease(fp) * 5;
        const cpy = tip * 0.55;
        const g = ctx.createLinearGradient(0, 0, 0, tip);
        g.addColorStop(0,   `rgba(160,100,20,${globalAlpha * 0.9})`);
        g.addColorStop(0.5, `rgba(190,130,35,${globalAlpha * 0.85})`);
        g.addColorStop(1,   `rgba(210,165,60,${globalAlpha * 0.3})`);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo( cpx, cpy, 0, tip);
        ctx.quadraticCurveTo(-cpx, cpy, 0, 0);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.restore();
      }

      // LAYER 2: inner white petals — broader, cupped
      const innerN = 14;
      const innerL = ease(fp) * maxR * 0.72;
      const innerW = ease(fp) * 14;
      for (let i = 0; i < innerN; i++) {
        const angle = (i / innerN) * Math.PI * 2 + spin * 0.9 + Math.PI / innerN;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        const g = ctx.createLinearGradient(0, 0, 0, -innerL);
        g.addColorStop(0,    `rgba(255,255,250,${globalAlpha * 0.07})`);
        g.addColorStop(0.3,  `rgba(255,255,252,${globalAlpha * 0.82})`);
        g.addColorStop(0.75, `rgba(240,240,235,${globalAlpha * 0.65})`);
        g.addColorStop(1,    `rgba(220,220,215,${globalAlpha * 0.15})`);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-innerW*0.6, -innerL*0.25, -innerW, -innerL*0.65, 0, -innerL);
        ctx.bezierCurveTo( innerW, -innerL*0.65,  innerW*0.6, -innerL*0.25, 0, 0);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = `rgba(200,200,195,${globalAlpha * 0.35})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();
      }

      // Spawn one falling petal every 30 seconds during PM death phase
      if (!isAM && p < 0.95) {
        if (now - lastPetalTime > 60000) {
          spawnPetal(cx, cy, p);
          lastPetalTime = now;
        }
      }

      // LAYER 3: stamen cluster — dense white threads, gold tips
      if (fp > 0.25) {
        const stamenCount = 28;
        const stamenR = ease(fp) * maxR * 0.38;
        for (let i = 0; i < stamenCount; i++) {
          const a = (i / stamenCount) * Math.PI * 2 + spin * 3;
          const spread = stamenR * (0.3 + (i % 3) * 0.22);
          const ex = cx + Math.cos(a) * spread;
          const ey = cy + Math.sin(a) * spread;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(ex, ey);
          ctx.strokeStyle = `rgba(240,240,230,${globalAlpha * 0.45})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(ex, ey, 1.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(220,175,50,${globalAlpha * 0.85})`;
          ctx.fill();
        }
      }

      // Spawn one falling petal every 30 seconds during PM death phase
      if (!isAM && p < 0.95) {
        if (now - lastPetalTime > 60000) {
          spawnPetal(cx, cy, p);
          lastPetalTime = now;
        }
      }

      // Core: soft cream-white glow
      const coreR = ease(fp) * 14;
      const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.5);
      cg.addColorStop(0,   `rgba(255,255,245,${globalAlpha * 0.95})`);
      cg.addColorStop(0.4, `rgba(240,235,210,${globalAlpha * 0.6})`);
      cg.addColorStop(1,   `rgba(200,190,160,0)`);
      ctx.beginPath();
      ctx.arc(cx, cy, coreR * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = cg;
      ctx.fill();
    }


    // --- BLOOM COUNT ---
    let lastDateKey = null;
    function checkBloom(secs) {
      const d = new Date();
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if (lastDateKey && key !== lastDateKey) {
        state.bloomCount++;
        state.petals = state.petals.filter(fp => fp.day >= state.bloomCount - 4);
        scheduleSave();
      }
      lastDateKey = key;
    }

    // --- MAIN LOOP ---
    function frame(now) {
      const d = new Date();
      const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
      const secs = h * 3600 + m * 60 + s;
      const isAM = secs <= 43200;
      const p = lifeProgress(secs);

      checkBloom(secs);
      phaseEl.textContent = getPhase(p, isAM);

      ctx.clearRect(0, 0, W, H);

      drawFallenPetals(now);
      drawGround(p);
      const stem = drawStem(p, now);
      if (stem) drawFlower(stem.x, stem.y, p, isAM, secs, now);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
